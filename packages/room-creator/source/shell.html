<!DOCTYPE html>

<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>TRAPSTAR · Room Creator v0.14.1 candidate</title><meta content="Offline multi-story room authoring editor with a graphics-card 3D view, first-person viewpoints, rails, sky and stairs." name="description"/><style>/*STYLE*/</style></head>
<body>
<div id="app">
<header class="header"><div class="brand"><strong>TRAPSTAR</strong><span>ROOM CREATOR <b>0.14</b></span></div><div class="document"><b id="documentName">Untitled floor plan</b><small id="saveStatus">New project · offline</small></div><nav aria-label="Project controls" class="header-actions"><button id="newBtn">New</button><button id="openBtn">Open</button><button class="primary" id="saveBtn">Save project</button><button id="exportBtn">Export</button><i class="divider"></i><button aria-label="Undo" class="icon" id="undoBtn" title="Undo · Ctrl+Z">↶</button><button aria-label="Redo" class="icon" id="redoBtn" title="Redo · Ctrl+Shift+Z">↷</button><button class="outline" id="testBtn">Test walk</button><button aria-label="Help" class="icon" id="helpBtn">?</button></nav></header>
<main class="workspace">
<aside class="left"><div class="left-tabs" role="tablist"><button class="active" data-pane="architecture">Build</button><button data-pane="assets">Images</button><button data-pane="views">Views</button><button data-pane="rails">Rails</button><button data-pane="sky">Sky</button><button data-pane="library">Library</button></div><div id="leftContent"></div></aside>
<section class="center">
<div class="scene-bar"><div class="segmented"><button class="active" id="isoBtn" title="Isometric map · 1">◇ Isometric</button><button id="planBtn" title="Flat top-down plan · 2">▦ Plan</button><button id="fpBtn" title="First person · 3">◈ First person</button></div><select aria-label="Active viewpoint" id="viewSelect"></select><span class="grow"></span><span class="badge" id="viewRole">FLOOR PLAN</span></div>
<div class="toolbar"><button class="active" data-tool="select" title="Select and move · V">↖ Select</button><button data-tool="view" title="Click a floor position, then a facing direction">+ View</button><button data-tool="partition" title="Draw a textured interior partition inside a room">Partition</button><button data-tool="freewall" title="Draw a free wall segment on the active story">Wall</button><button data-tool="floorsection" title="Add floor space on this story; drag and resize afterward">+ Floor space</button><button data-tool="ceilingcut" title="Cut a rectangular opening from the selected room ceiling">Ceiling cut</button><button data-tool="ceilingpatch" title="Add a rectangular ceiling patch to the selected room">Ceiling add</button><button data-tool="pillar" title="Place a structural pillar anywhere on the active story">Pillar</button><button data-tool="door">Door</button><button data-tool="window">Window</button><button data-tool="passage">Open wall</button><button data-tool="light">Light</button><button data-tool="link">↔ Route</button><button data-tool="rail" title="Add stops and bends to the selected rail">⟿ Rail</button><button data-tool="stairs" title="Drag out a straight flight of stairs to the story above">Stairs</button><button data-tool="floorcut" title="Cut a rectangular opening in this story's floor">Floor hole</button><span class="grow"></span><button class="active" id="gridBtn">Grid</button><button class="active" id="snapBtn">Snap</button><button id="labelsBtn" title="Map labels: selected room / all rooms / off · L">Labels: selected</button><button id="iconsBtn" title="Map icons: doors, windows and lights / all / off · I">Icons: doors</button><button id="fitBtn" title="Fit plan · F">Fit</button></div>
<div id="stageWrap"><canvas aria-hidden="true" id="glStage"></canvas><canvas aria-label="Room layout and linked first-person editor" id="stage" tabindex="0"></canvas><div class="fp-hud hidden" id="fpHud"></div><div class="elevator hidden" id="elevator"></div><div class="timeline hidden" id="timeline"></div><div class="stage-title" id="stageTitle"></div><div class="floor-readout hidden" id="floorReadout" role="status"></div><div class="state-bar hidden" id="stateBar"></div><div class="empty-hint hidden" id="emptyHint"></div><div class="mini-wrap" id="miniWrap"><div><span id="miniTitle">LIVE FIRST PERSON</span><button aria-label="Hide preview" id="miniClose" title="Toggle live companion preview">−</button></div><canvas aria-label="Live linked companion view" height="275" id="mini" tabindex="0" width="440"></canvas><small id="miniNote">Place a viewpoint on the map to begin.</small></div><div class="zoom-box"><button aria-label="Zoom out" id="zoomOut">−</button><span id="zoomLabel">100%</span><button aria-label="Zoom in" id="zoomIn">+</button><button id="miniToggle" title="Show or hide linked preview">◫</button><button id="fullBtn" title="Fullscreen canvas">⛶</button></div></div>
<div class="guide-bar" id="guideBar"><span class="guide-mark">01</span><span id="guideText">Shape the floor plan. Place a view. Import your own assets.</span></div>
<div class="view-strip" id="viewStrip"></div>
</section>
<aside class="right"><div class="inspector-tabs"><button class="active" data-panel="room">Room</button><button data-panel="style">Style</button><button data-panel="selection">Selected</button></div><div id="inspector"></div></aside>
</main><footer><span id="statusText">Select · drag objects or viewpoint markers</span><span class="grow"></span><span id="statusCounts"></span><span id="engineBadge">LOCAL FILE</span></footer>
</div>
<div id="modalRoot"></div><div class="toast hidden" id="toast" role="status"></div><div class="recovery hidden" id="recovery"></div>
<input accept=".json,.room.json,application/json" hidden="" id="projectFile" type="file"/><input accept="image/png,image/jpeg,image/webp" hidden="" id="assetFiles" multiple="" type="file"/><input accept="image/png,image/jpeg,image/webp" hidden="" id="materialFile" type="file"/><input hidden="" id="libraryFolder" type="file" webkitdirectory="" multiple=""/><input accept=".json,application/json" hidden="" id="looksFile" type="file"/>
<script>/*THREE*/</script><script>/*GLTFLOADER*/</script><script>/*LEGACY1*/</script><script>/*LEGACY3*/</script><script>/*CORE*/</script><script>/*RAILS*/</script><script>/*RENDERER*/</script><script>/*GL*/</script><script>/*ASSETS*/</script><script>/*APP*/</script>
</body></html>
